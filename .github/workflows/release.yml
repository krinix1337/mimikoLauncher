name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare app-lib environment
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Inject updater public key
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$TAURI_UPDATER_PUBKEY" ]; then
            echo "::error::Repository variable TAURI_UPDATER_PUBKEY is not set"
            exit 1
          fi
          node -e "const fs=require('fs');const p='apps/app/tauri-release.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.plugins.updater.pubkey=process.env.TAURI_UPDATER_PUBKEY;fs.writeFileSync(p,JSON.stringify(c,null,'\t'))"

      - name: Read release version
        id: release
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/app
          tauriScript: pnpm tauri
          args: --config tauri-release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: mimikoLauncher ${{ steps.release.outputs.version }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
